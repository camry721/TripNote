<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#176b61">
<title>TripNote - 旅のしおり</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f6f5;color:#263431;font-family:system-ui,-apple-system,sans-serif}
header{background:#176b61;color:white;padding:25px 20px 30px;border-radius:0 0 24px 24px}
header h1{margin:0;font-size:27px}
header p{margin:7px 0 0;color:#d7eeea;font-size:14px}
main{max-width:650px;margin:auto;padding:20px 15px 50px}
button{border:0;border-radius:12px;padding:12px 16px;font-size:14px;font-weight:650;cursor:pointer}
.primary{background:#176b61;color:white}
.secondary{background:#e4efec;color:#176b61}
.danger{background:#fff0ed;color:#b34d3e}
.card{background:white;border-radius:17px;padding:17px;margin:13px 0;box-shadow:0 2px 9px #183c3010}
h2{font-size:18px;margin:5px 0 13px}
h3{font-size:16px;margin:0 0 8px}
.muted{color:#71807b;font-size:13px}
input,textarea{width:100%;padding:12px;border:1px solid #d8e1dd;border-radius:10px;font-size:15px;background:white;color:#263431;margin:6px 0 13px}
label{font-size:13px;font-weight:650}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.trip-title{font-size:18px;font-weight:750}
.hidden{display:none!important}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
footer{text-align:center;color:#87938e;font-size:12px;padding:25px}
.day-card{border-top:4px solid #75aaa0}
.day-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.day-date{font-size:17px;font-weight:750}
.detail-line{font-size:14px;margin:7px 0}
.schedule{border-left:4px solid #75aaa0;padding:7px 0 8px 12px;margin:12px 0}
.schedule.important{border-left-color:#d9534f;background:#fff7f6;padding:9px 10px;border-radius:0 9px 9px 0}
.schedule.target{border-left-color:#e49a25;background:#fffaf0;padding:9px 10px;border-radius:0 9px 9px 0}
.schedule-time{font-weight:800;font-size:17px}
.important .schedule-time{color:#c43f3b}
.target .schedule-time{color:#b87512}
.pill{display:inline-block;border-radius:20px;padding:3px 8px;font-size:11px;font-weight:700;margin-left:5px}
.pill.important{background:#ffe3e0;color:#b93832}
.pill.target{background:#fff0cf;color:#98600b}
.form-note{font-size:12px;color:#71807b;margin:-7px 0 12px}
.checkline{display:inline-flex;gap:7px;align-items:center;margin:4px 8px 12px 0;padding:9px 12px;border:1px solid #d8e1dd;border-radius:10px;cursor:pointer;font-size:14px;min-height:42px;user-select:none}
.checkline input{accent-color:#176b61}
.checkline input{width:auto;margin:0;cursor:pointer}
.form-slot{margin:10px 0}
.day-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:10px 0}
.day-nav button{padding:10px 13px}
.day-nav-label{font-weight:750;text-align:center;flex:1}
.day-card{touch-action:pan-y}

.subcard{background:#f7faf8;border-radius:12px;padding:12px;margin-top:12px}
hr{border:0;border-top:1px solid #e6ece9;margin:14px 0}
</style>
</head>
<body>
<header>
  <h1>✈ TripNote</h1>
  <p>旅の思い出も、予定も、ここに。</p>
</header>
<main>
  <section id="home">
    <div class="row">
      <h2>マイ旅行ノート</h2>
      <button class="primary" onclick="showNew()">＋ 新しい旅行</button>
    </div>
    <div id="tripList"></div>
    <div class="card">
      <h3>📥 ChatGPTから旅行を取り込む</h3>
      <p class="muted">JSON形式の旅行データを読み込めます。</p>
      <input type="file" id="importFile" accept=".json,application/json">
      <button class="secondary" onclick="importTrip()">旅行データを読み込む</button>
    </div>
  </section>

  <section id="newTrip" class="hidden">
    <div class="card">
      <h2 id="tripFormTitle">新しい旅行を作成</h2>
      <label>旅行の名前</label><input id="newName" placeholder="例：2027年 年始旅行">
      <label>行き先</label><input id="newPlace" placeholder="例：四国・九州">
      <label>出発日</label><input id="newDate" type="date">
      <label>帰着日</label><input id="newEnd" type="date">
      <div class="actions">
        <button class="primary" onclick="saveTrip()">保存する</button>
        <button class="secondary" onclick="cancelTripForm()">戻る</button>
      </div>
    </div>
  </section>

  <section id="detail" class="hidden">
    <button class="secondary" onclick="goHome()">← 一覧に戻る</button>
    <div class="card">
      <h2 id="detailName"></h2>
      <p id="detailInfo" class="muted"></p>
      <div class="actions">
        <button class="secondary" onclick="showDayForm()">＋ 日程を追加</button>
        <button class="secondary" onclick="editTrip()">旅行を編集</button>
        <button class="secondary" onclick="exportTrip()">旅行データを書き出す</button>
        <button class="danger" onclick="deleteTrip()">旅行を削除</button>
      </div>
    </div>

    <div id="dayForm" class="card hidden">
      <h3 id="dayFormTitle">日程を追加</h3>
      <label>日付</label><input id="dayDate" type="date">
      <label>この日のテーマ</label><input id="dayTheme" placeholder="例：道後温泉へ移動・観光">
      <label>見どころ・メモ</label><textarea id="dayHighlights" rows="2" placeholder="この日の目的や楽しみたいこと"></textarea>
      <hr>
      <label>出発地</label><input id="dayDeparture" placeholder="例：五條市田園">
      <label>出発時刻</label><input id="dayDepartureTime" type="time">
      <label>到着地</label><input id="dayArrival" placeholder="例：大和屋本店">
      <label>到着時刻</label><input id="dayArrivalTime" type="time">
      <hr>
      <label>宿泊先</label><input id="dayAccommodation" placeholder="例：大和屋本店">
      <label>宿泊先メモ</label><textarea id="dayAccommodationMemo" rows="2" placeholder="予約番号・チェックイン情報など"></textarea>
      <div class="actions">
        <button class="primary" onclick="saveDay()">日程を保存</button>
        <button class="secondary" onclick="hideDayForm()">閉じる</button>
      </div>
    </div>

    <div id="scheduleForm" class="card hidden">
      <h3 id="scheduleFormTitle">時程を追加</h3>
      <label>開始時刻（任意）</label><input id="scheduleTime" type="time">
      <label>終了時刻（任意）</label><input id="scheduleEndTime" type="time">
      <div class="form-note">開始時刻だけでも、時刻なしでも登録できます。終了時刻を入れると時間帯で表示します。</div>
      <label>時間の種類</label><div>
      <label class="checkline"><input type="checkbox" id="scheduleImportant"><span>🔴 重要</span></label>
      <label class="checkline"><input type="checkbox" id="scheduleTarget"><span>🟠 目安</span></label>
      </div>
      <label>予定・場所</label><input id="scheduleTitle" placeholder="例：フェリー出航">
      <label>メモ</label><textarea id="scheduleMemo" rows="3" placeholder="移動方法や料金など"></textarea>
      <div class="actions">
        <button class="primary" onclick="saveSchedule()">時程を保存</button>
        <button class="secondary" onclick="hideScheduleForm()">閉じる</button>
      </div>
    </div>

    <h2>旅行の日程</h2>
    <div id="dayFormHomeSlot" class="form-slot"></div>
    <div id="scheduleFormHomeSlot" class="form-slot"></div>
    <div id="days"></div>
  </section>
</main>
<footer>TripNote · あなたの旅のしおり</footer>

<script>
let trips = JSON.parse(localStorage.getItem("tripnote_trips") || "[]");
let currentId = null;
let editingTrip = false, editingDayId = null, editingScheduleId = null, activeDayId = null;
let activeDayIndex = 0, dayListMode = false, swipeStartX = null;

function saveAll(){localStorage.setItem("tripnote_trips",JSON.stringify(trips));}
function show(id){["home","newTrip","detail"].forEach(x=>document.getElementById(x).classList.add("hidden"));document.getElementById(id).classList.remove("hidden");}
function goHome(){show("home");renderTrips();}
function getTrip(){return trips.find(x=>String(x.id)===String(currentId));}
function dateLabel(d){if(!d)return "日付未設定";const p=d.split("-");return `${p[0]}年${Number(p[1])}月${Number(p[2])}日`;}
function showNew(){
  editingTrip=false;document.getElementById("tripFormTitle").textContent="新しい旅行を作成";
  ["newName","newPlace","newDate","newEnd"].forEach(id=>document.getElementById(id).value="");
  show("newTrip");
}
function editTrip(){
  const t=getTrip();if(!t)return;editingTrip=true;
  document.getElementById("tripFormTitle").textContent="旅行を編集";
  document.getElementById("newName").value=t.name||"";
  document.getElementById("newPlace").value=t.place||"";
  document.getElementById("newDate").value=t.date||"";
  document.getElementById("newEnd").value=t.end||"";
  show("newTrip");
}
function cancelTripForm(){if(editingTrip)openTrip(currentId);else goHome();}
function saveTrip(){
  const name=document.getElementById("newName").value.trim();
  if(!name){alert("旅行の名前を入力してください");return;}
  const values={name,place:document.getElementById("newPlace").value.trim(),date:document.getElementById("newDate").value,end:document.getElementById("newEnd").value};
  if(editingTrip){const t=getTrip();Object.assign(t,values);saveAll();openTrip(t.id);}
  else{const t={id:Date.now(),...values,days:[],entries:[]};trips.push(t);saveAll();openTrip(t.id);}
}
function renderTrips(){
  const box=document.getElementById("tripList");
  if(!trips.length){box.innerHTML='<div class="card"><p>まだ旅行がありません。</p><p class="muted">「新しい旅行」から最初の旅を作りましょう。</p></div>';return;}
  box.innerHTML=trips.map(t=>`<div class="card" onclick="openTrip('${String(t.id).replace(/'/g,"")}')"><div class="trip-title">${escapeHtml(t.name)}</div><p class="muted">${escapeHtml(t.place||"行き先未設定")} · ${escapeHtml(t.date||"日付未設定")}</p><span class="muted">${(t.days||[]).length} 日程</span></div>`).join("");
}
function migrateTrip(t){
  if(Array.isArray(t.days))return;
  const grouped={};
  (t.entries||[]).forEach(e=>{
    const d=e.date||t.date||"";
    if(!grouped[d])grouped[d]={id:"day-"+d+"-"+Math.random().toString(36).slice(2,7),date:d,theme:"",highlights:"",departure:"",departureTime:"",arrival:"",arrivalTime:"",accommodation:"",accommodationMemo:"",schedules:[]};
    grouped[d].schedules.push({id:e.id||Date.now()+Math.random(),time:e.time||"",endTime:e.endTime||"",title:e.title||"",memo:e.memo||"",timeType:e.timeType||"normal"});
  });
  t.days=Object.values(grouped);
  t.days.sort((a,b)=>(a.date||"").localeCompare(b.date||""));
  t.entries=[];
}
function openTrip(id){
  currentId=id;const t=getTrip();if(!t)return;
  migrateTrip(t);saveAll();
  document.getElementById("detailName").textContent=t.name;
  document.getElementById("detailInfo").textContent=[t.place,t.date,t.end].filter(Boolean).join("　〜　");
  activeDayIndex=0;dayListMode=false;hideDayForm();hideScheduleForm();renderDays();show("detail");
}
function showDayForm(id=null){
  editingDayId=id;const t=getTrip();const d=id?(t.days||[]).find(x=>String(x.id)===String(id)):null;
  document.getElementById("dayFormTitle").textContent=d?"日程を編集":"日程を追加";
  document.getElementById("dayDate").value=d?.date||t.date||"";
  document.getElementById("dayTheme").value=d?.theme||"";
  document.getElementById("dayHighlights").value=d?.highlights||"";
  document.getElementById("dayDeparture").value=d?.departure||"";
  document.getElementById("dayDepartureTime").value=d?.departureTime||"";
  document.getElementById("dayArrival").value=d?.arrival||"";
  document.getElementById("dayArrivalTime").value=d?.arrivalTime||"";
  document.getElementById("dayAccommodation").value=d?.accommodation||"";
  document.getElementById("dayAccommodationMemo").value=d?.accommodationMemo||"";
  const form=document.getElementById("dayForm");
  const slot=id?document.getElementById("day-form-slot-"+id):document.getElementById("dayFormHomeSlot");
  if(slot)slot.appendChild(form);
  form.classList.remove("hidden");
  hideScheduleForm();
  form.scrollIntoView({behavior:"smooth",block:"center"});
}
function hideDayForm(){const y=window.scrollY;const f=document.getElementById("dayForm");f.classList.add("hidden");document.getElementById("dayFormHomeSlot").appendChild(f);editingDayId=null;requestAnimationFrame(()=>window.scrollTo(0,y));}
function saveDay(){
  const t=getTrip(),date=document.getElementById("dayDate").value;
  if(!date){alert("日付を入力してください");return;}
  const d={id:editingDayId||("day-"+Date.now()),date,theme:document.getElementById("dayTheme").value.trim(),highlights:document.getElementById("dayHighlights").value.trim(),departure:document.getElementById("dayDeparture").value.trim(),departureTime:document.getElementById("dayDepartureTime").value,arrival:document.getElementById("dayArrival").value.trim(),arrivalTime:document.getElementById("dayArrivalTime").value,accommodation:document.getElementById("dayAccommodation").value.trim(),accommodationMemo:document.getElementById("dayAccommodationMemo").value.trim(),schedules:[]};
  if(editingDayId){const old=t.days.find(x=>String(x.id)===String(editingDayId));d.schedules=old?.schedules||[];t.days=t.days.map(x=>String(x.id)===String(editingDayId)?d:x);}
  else t.days.push(d);
  const previousScrollY=window.scrollY;saveAll();hideDayForm();renderDays();const idx=[...t.days].sort((a,b)=>(a.date||"").localeCompare(b.date||"")).findIndex(x=>String(x.id)===String(d.id));if(idx>=0)activeDayIndex=idx;dayListMode=false;renderDays();requestAnimationFrame(()=>window.scrollTo(0,previousScrollY));
}
function showScheduleForm(dayId,id=null){
  const t=getTrip(),d=t.days.find(x=>String(x.id)===String(dayId)),s=id?d.schedules.find(x=>String(x.id)===String(id)):null;
  activeDayId=dayId;editingScheduleId=id;
  document.getElementById("scheduleFormTitle").textContent=s?"時程を編集":"時程を追加";
  document.getElementById("scheduleTime").value=s?.time||"";
  document.getElementById("scheduleEndTime").value=s?.endTime||"";
  document.getElementById("scheduleTitle").value=s?.title||"";
  document.getElementById("scheduleMemo").value=s?.memo||"";
  document.getElementById("scheduleImportant").checked=s?.timeType==="important" || s?.timeType==="both";
  document.getElementById("scheduleTarget").checked=s?.timeType==="target" || s?.timeType==="both";
  const form=document.getElementById("scheduleForm");
  const slot=id?document.getElementById("schedule-form-slot-"+id):document.getElementById("schedule-day-slot-"+dayId);
  if(slot)slot.appendChild(form);
  form.classList.remove("hidden");
  hideDayForm();
  form.scrollIntoView({behavior:"smooth",block:"center"});
}
function hideScheduleForm(){const y=window.scrollY;const f=document.getElementById("scheduleForm");f.classList.add("hidden");document.getElementById("scheduleFormHomeSlot").appendChild(f);editingScheduleId=null;activeDayId=null;requestAnimationFrame(()=>window.scrollTo(0,y));}
function saveSchedule(){
  const title=document.getElementById("scheduleTitle").value.trim();if(!title){alert("予定・場所を入力してください");return;}
  const t=getTrip(),d=t.days.find(x=>String(x.id)===String(activeDayId));
  const time=document.getElementById("scheduleTime").value;
  const endTime=document.getElementById("scheduleEndTime").value;
  if(endTime&&!time){alert("終了時刻を設定する場合は、開始時刻も入力してください");return;}
  const important=document.getElementById("scheduleImportant").checked;
  const target=document.getElementById("scheduleTarget").checked;
  const timeType=important&&target?"both":important?"important":target?"target":"normal";
  const s={id:editingScheduleId||("schedule-"+Date.now()),time,endTime,title,memo:document.getElementById("scheduleMemo").value.trim(),timeType};
  if(editingScheduleId)d.schedules=d.schedules.map(x=>String(x.id)===String(editingScheduleId)?s:x);else d.schedules.push(s);
  const savedDayId=activeDayId,scrollY=window.scrollY;saveAll();hideScheduleForm();renderDays();requestAnimationFrame(()=>window.scrollTo(0,scrollY));
}
function renderDays(){
  const t=getTrip(),box=document.getElementById("days");if(!t)return;
  const days=[...(t.days||[])].sort((a,b)=>(a.date||"").localeCompare(b.date||""));
  if(!days.length){box.innerHTML='<div class="card muted">まだ日程がありません。「日程を追加」から登録できます。</div>';return;}
  if(activeDayIndex>=days.length)activeDayIndex=days.length-1;
  const shown=dayListMode?days:[days[activeDayIndex]];
  const nav=dayListMode?'':`<div class="day-nav"><button class="secondary" onclick="changeDay(-1)" ${activeDayIndex===0?'disabled':''}>‹ 前の日</button><div class="day-nav-label">${activeDayIndex+1} / ${days.length}日目</div><button class="secondary" onclick="changeDay(1)" ${activeDayIndex===days.length-1?'disabled':''}>次の日 ›</button></div>`;
  const listButton=`<div class="actions"><button class="secondary" onclick="toggleDayList()">${dayListMode?'1日表示に戻る':'日程一覧を見る'}</button></div>`;
  box.innerHTML=nav+shown.map(d=>{
    const i=days.findIndex(x=>String(x.id)===String(d.id));
    const schedules=[...(d.schedules||[])].sort((a,b)=>(a.time||"99:99").localeCompare(b.time||"99:99"));
    return `<div class="card day-card" id="day-card-${escapeHtml(d.id)}">
      <div class="day-head"><div><div class="day-date">${dateLabel(d.date)} <span class="muted">${i+1}日目</span></div><h3>${escapeHtml(d.theme||"テーマ未設定")}</h3></div></div>
      <div id="day-form-slot-${escapeHtml(d.id)}" class="form-slot"></div>
      ${d.highlights?`<p class="detail-line">${escapeHtml(d.highlights)}</p>`:""}
      ${(d.departure||d.arrival)?`<div class="subcard">${d.departure?`<div class="detail-line">🚗 出発：${escapeHtml(d.departure)} ${escapeHtml(d.departureTime||"")}</div>`:""}${d.arrival?`<div class="detail-line">🏁 到着：${escapeHtml(d.arrival)} ${escapeHtml(d.arrivalTime||"")}</div>`:""}</div>`:""}
      ${d.accommodation?`<div class="subcard"><strong>🏨 宿泊先：${escapeHtml(d.accommodation)}</strong>${d.accommodationMemo?`<p class="muted">${escapeHtml(d.accommodationMemo)}</p>`:""}</div>`:""}
      <div class="actions"><button class="secondary" onclick="showDayForm('${String(d.id)}')">日程を編集</button><button class="danger" onclick="removeDay('${String(d.id)}')">日程を削除</button></div>
      <hr><div class="row"><strong>時程</strong><button class="primary" onclick="showScheduleForm('${String(d.id)}')">＋ 時程を追加</button></div>
      <div id="schedule-day-slot-${escapeHtml(d.id)}" class="form-slot"></div>
      ${schedules.length?schedules.map(s=>`<div class="schedule ${s.timeType==="important"||s.timeType==="both"?"important":s.timeType==="target"?"target":""}" id="schedule-item-${escapeHtml(s.id)}">
        <div class="schedule-time">${escapeHtml(s.time?(s.endTime?s.time+"〜"+s.endTime:s.time):"時刻未設定")}${s.timeType==="important"||s.timeType==="both"?'<span class="pill important">重要</span>':s.timeType==="target"?'<span class="pill target">目安</span>':""}</div>
        <strong>${escapeHtml(s.title)}</strong>${s.memo?`<p class="muted">${escapeHtml(s.memo)}</p>`:""}
        <div class="actions"><button class="secondary" onclick="showScheduleForm('${String(d.id)}','${String(s.id)}')">編集</button><button class="danger" onclick="removeSchedule('${String(d.id)}','${String(s.id)}')">削除</button></div>
        <div id="schedule-form-slot-${escapeHtml(s.id)}" class="form-slot"></div>
      </div>`).join(""):'<p class="muted">時程はまだありません。</p>'}
      ${dayListMode?`<div class="actions"><button class="primary" onclick="viewDay(${i})">この日を見る</button></div>`:""}
    </div>`;
  }).join("")+listButton;
  box.ontouchstart=e=>{swipeStartX=e.changedTouches[0].screenX;};
  box.ontouchend=e=>{if(swipeStartX===null||dayListMode)return;const dx=e.changedTouches[0].screenX-swipeStartX;swipeStartX=null;if(Math.abs(dx)>55)changeDay(dx<0?1:-1);};
}
function changeDay(delta){const t=getTrip(),days=[...(t?.days||[])].sort((a,b)=>(a.date||"").localeCompare(b.date||""));activeDayIndex=Math.max(0,Math.min(days.length-1,activeDayIndex+delta));renderDays();}
function toggleDayList(){dayListMode=!dayListMode;renderDays();}
function viewDay(index){activeDayIndex=index;dayListMode=false;renderDays();window.scrollTo({top:document.getElementById("days").offsetTop-15,behavior:"smooth"});}

function removeDay(id){if(!confirm("この日程と、その中の時程を削除しますか？"))return;const t=getTrip();t.days=t.days.filter(x=>String(x.id)!==String(id));saveAll();renderDays();}
function removeSchedule(dayId,id){if(!confirm("この時程を削除しますか？"))return;const t=getTrip(),d=t.days.find(x=>String(x.id)===String(dayId));d.schedules=d.schedules.filter(x=>String(x.id)!==String(id));saveAll();renderDays();}
function deleteTrip(){if(!confirm("この旅行を削除しますか？"))return;trips=trips.filter(x=>String(x.id)!==String(currentId));saveAll();goHome();}
function exportTrip(){
